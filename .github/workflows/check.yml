name: Check extension
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:activation
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: pagecrit-chrome
          path: dist/pagecrit.zip
  # Pushing a v* tag publishes a GitHub release with the tested zip attached.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pagecrit-chrome
      - name: Check the tag matches the manifest version
        run: test "v$(node -p "require('./extension/manifest.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pagecrit.zip --title "PageCrit ${GITHUB_REF_NAME#v}" --notes-file - <<'EOF'
          Download **pagecrit.zip**, unzip it, then open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and choose the unzipped `pagecrit` folder.

          Updating? Remove the old version (or replace its folder), load the new one, then refresh any tabs you were reviewing.
          EOF
