<!doctype html><html><head><meta charset="utf-8"><title>Stress fixture</title><style>
*{box-sizing:border-box}body{margin:0;padding:45px;font:18px/1.6 system-ui;background:#f4f5ef;color:#243324}main{width:min(650px,90vw)}h1{font-size:36px;line-height:1.2}p{margin:22px 0}a{color:#225599}input,textarea,button{font:inherit}#deep{margin-top:1000px}footer{height:800px}#inline{white-space:pre-wrap}
</style></head><body><main><h1 id="headline">Simple <em>nested</em> heading</h1><p id="plain">Original paragraph for edit cycles.</p><p id="inline">Original inline content.</p><p><a id="link" href="/navigated">Do not navigate this link</a></p><button id="button">Do not submit this button</button><p id="framework">Framework initial value</p><p id="pin1">First comment target</p><p id="pin2">Second comment target</p><p id="pin3">Third comment target</p><form><input id="disabled" value="disabled original" disabled><input id="input" value="editable original"><textarea id="textarea">Form original</textarea><div id="editable" contenteditable="true">Site editor original</div></form><p id="deep">Far down page</p><footer></footer></main><script>window.siteActions=0;document.querySelector('#button').addEventListener('click',()=>window.siteActions++);document.querySelector('#link').addEventListener('click',()=>window.siteActions++);</script></body></html>
